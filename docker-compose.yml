services:
  db:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: recipe_planner
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - recipe_planner_data:/var/lib/postgresql/data

volumes:
  recipe_planner_data:
